<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie - Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <h1>🍔 Foodie</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="#">Orders</a>
            <a href="#">🛒 Cart</a>
        </nav>

    </header>


    <!-- Welcome Section -->
    <section class="welcome">

        <h2>Welcome to Foodie! 👋</h2>

        <p>Order your favourite food anytime, anywhere.</p>

        <input
            type="text"
            placeholder="🔍 Search for food..."
        >

    </section>


    <!-- Categories -->
    <section class="categories">

        <h2>Food Categories</h2>

        <div class="category-list">

            <div class="category">
                🍕
                <p>Pizza</p>
            </div>

            <div class="category">
                🍔
                <p>Burger</p>
            </div>

            <div class="category">
                🍗
                <p>Biryani</p>
            </div>

            <div class="category">
                🍜
                <p>Noodles</p>
            </div>

        </div>

    </section>


    <!-- Popular Food -->
    <section class="popular">

        <h2>Popular Foods</h2>

        <div class="food-list">

            <div class="food-card">
                <div class="food-image">🍗</div>
                <h3>Chicken Biryani</h3>
                <p>₹150</p>
                <button>Add to Cart</button>
            </div>

            <div class="food-card">
                <div class="food-image">🍕</div>
                <h3>Cheese Pizza</h3>
                <p>₹200</p>
                <button>Add to Cart</button>
            </div>

            <div class="food-card">
                <div class="food-image">🍔</div>
                <h3>Chicken Burger</h3>
                <p>₹120</p>
                <button>Add to Cart</button>
            </div>

        </div>

    </section>

</body>
</html>
