<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie - Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <h1>🍔 Foodie</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Orders</a>
            <a href="cart.html">🛒 Cart</a>
        </nav>

    </header>


    <!-- Menu Heading -->
    <section class="menu-section">

        <h2>Our Menu 🍽️</h2>

        <p>Choose your favourite food</p>


        <!-- Food List -->
        <div class="food-list">

            <!-- Biryani -->
            <div class="food-card">

                <div class="food-image">🍗</div>

                <h3>Chicken Biryani</h3>

                <p>Delicious chicken biryani</p>

                <h3>₹150</h3>

                <button>Add to Cart</button>

            </div>


            <!-- Pizza -->
            <div class="food-card">

                <div class="food-image">🍕</div>

                <h3>Cheese Pizza</h3>

                <p>Cheesy and tasty pizza</p>

                <h3>₹200</h3>

                <button>Add to Cart</button>

            </div>


            <!-- Burger -->
            <div class="food-card">

                <div class="food-image">🍔</div>

                <h3>Chicken Burger</h3>

                <p>Fresh chicken burger</p>

                <h3>₹120</h3>

                <button>Add to Cart</button>

            </div>


            <!-- Noodles -->
            <div class="food-card">

                <div class="food-image">🍜</div>

                <h3>Veg Noodles</h3>

                <p>Hot and spicy noodles</p>

                <h3>₹100</h3>

                <button>Add to Cart</button>

            </div>

        </div>

    </section>
   <script src="script.js"></script>

</body>
</html>
